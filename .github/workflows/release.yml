name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Pack
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "$GITHUB_REF_NAME" ] && VER="dev"
          hdiutil create -volname ChargeSense -srcfolder ChargeSense.app -ov -format UDZO "ChargeSense-$VER.dmg"
          shasum -a 256 "ChargeSense-$VER.dmg" > "checksums-$VER.txt"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ChargeSense-*.dmg
            checksums-*.txt
          body: |
            ## What's new

            - (edit after publishing, or drop this section)

            ## Install

            Open the dmg, drag **ChargeSense.app** to `/Applications`, launch.

            > ⚠️ **Ad-hoc signed** — no Apple Developer ID. Gatekeeper may protest on
            > first launch: right-click the app → **Open**, or
            > `xattr -cr /Applications/ChargeSense.app`
